# fly.toml app configuration file generated for wormhole-flyio on 2026-11-10T23:48:16Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'erik-reed-wormhole'
primary_region = 'lax'

[[services]]
  protocol = "tcp"
  internal_port = 4001
  auto_stop_machines = "off"
  auto_start_machines = true

  [[services.ports]]
    port = 4001
    handlers = []

[[services]]
  protocol = "tcp"
  internal_port = 4000
  auto_stop_machines = "off"
  auto_start_machines = true

  [[services.ports]]
    port = 4000
    handlers = ["http"]
    force_https = false

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '1gb'
  memory_mb = 1024
