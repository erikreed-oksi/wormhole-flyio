app = 'wormhole-flyio'
primary_region = 'lax'

[http_service]
  auto_start_machines = false
  auto_stop_machines = 'stop'
  force_https = true
  internal_port = 8001
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '1gb'
  memory_mb = 1024
