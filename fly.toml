# Change this to a globally unique name, and use that same name with apps create.
app = "wormhole-flyio"
primary_region = "lax"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

# Update the single Machine in place. Deploy when no transfers are active.
[deploy]
  strategy = "rolling"

[[services]]
  protocol = "tcp"
  internal_port = 4001
  auto_stop_machines = "off"
  auto_start_machines = true

  [[services.ports]]
    port = 4001
    # Pass the Wormhole protocol through unchanged.
    handlers = []

  [services.concurrency]
    type = "connections"
    soft_limit = 20
    hard_limit = 40

  [[services.tcp_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"

[[restart]]
  policy = "always"
