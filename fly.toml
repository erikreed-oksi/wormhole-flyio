# fly.toml app configuration file generated for wormhole-flyio on 2026-11-10T23:48:16Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'erik-reed-wormhole'
primary_region = 'lax'
kill_signal = 'SIGTERM'
kill_timeout = '10s'

[[mounts]]
  source = 'mailbox_data'
  destination = '/data'

[[services]]
  protocol = "tcp"
  internal_port = 4001
  auto_stop_machines = "off"
  auto_start_machines = true

  [[services.ports]]
    port = 4001
    handlers = []

  [[services.tcp_checks]]
    grace_period = "10s"
    interval = "15s"
    timeout = "2s"

[[services]]
  protocol = "tcp"
  internal_port = 4000
  auto_stop_machines = "off"
  auto_start_machines = true

  [[services.ports]]
    port = 4000
    handlers = ["http"]
    force_https = false

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    grace_period = "10s"
    interval = "15s"
    timeout = "2s"
    method = "GET"
    path = "/"

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '1gb'
  memory_mb = 1024

[[restart]]
  policy = 'on-failure'
  retries = 10
