# fly.toml app configuration file generated for wormhole-flyio on 2026-11-10T01:26:11Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'wormhole-flyio'
primary_region = 'lax'

[build]
[http_service]
  internal_port = 4001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
